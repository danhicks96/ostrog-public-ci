name: Bug report
description: Something in the simulation or tools behaves wrongly. Outside issues are not being taken yet and may be closed without review.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste private information: no real names, email addresses, IP addresses, hostnames, home-directory paths or tokens. Use placeholders.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Seed, day and steps to reproduce
