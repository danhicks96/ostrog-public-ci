# Gentle housekeeping: draft and open pull requests and issues with no activity get a label
# after 60 days and close after 30 more. Nothing is closed in the first 60 days, and items
# labelled keep, pinned or security are never touched.
name: stale

on:
  schedule:
    - cron: '11 7 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9
        with:
          days-before-stale: 60
          days-before-close: 30
          operations-per-run: 60
          exempt-issue-labels: keep,pinned,security
          exempt-pr-labels: keep,pinned,security
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: "No activity for 60 days, so this is marked stale. It closes in 30 days unless something changes. Outside issues are not being taken yet."
          stale-pr-message: "No activity for 60 days, so this is marked stale. It closes in 30 days unless it is updated."
