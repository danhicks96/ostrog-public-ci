# Lints the workflow files themselves: actionlint (syntax, expressions, shell) and zizmor
# (injection, excessive permissions, unpinned actions). Only runs when workflows change.
name: workflow-lint

on:
  pull_request:
    paths: [".github/**"]
  push:
    branches: [main]
    paths: [".github/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          ver=1.7.9
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ver}/actionlint_${ver}_linux_amd64.tar.gz" -o /tmp/al.tgz
          tar -xzf /tmp/al.tgz -C /tmp actionlint
          /tmp/actionlint -color

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: zizmor
        run: |
          python3 -m pip install --quiet "zizmor>=1.0,<2"
          zizmor --offline --min-severity medium .github
