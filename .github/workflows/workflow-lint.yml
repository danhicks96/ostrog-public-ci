# Lints the workflow files themselves: actionlint (syntax, expressions, shell) and zizmor
# (injection, excessive permissions, unpinned actions). Only runs when workflows change.
name: workflow-lint

on:
  pull_request:
    paths: [".github/**"]
  push:
    branches: [main]
    paths: [".github/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          ver=1.7.9
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ver}/actionlint_${ver}_linux_amd64.tar.gz" -o /tmp/al.tgz
          echo "233b280d05e100837f4af1433c7b40a5dcb306e3aa68fb4f17f8a7f45a7df7b4  /tmp/al.tgz" | sha256sum -c -
          tar -xzf /tmp/al.tgz -C /tmp actionlint
          /tmp/actionlint -color

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: zizmor
        run: |
          python3 -m pip install --quiet "zizmor==1.33.1"
          zizmor --offline --min-severity medium .github
