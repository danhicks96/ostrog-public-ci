# OpenSSF Scorecard: grades repo hygiene (pinned actions, token permissions, branch protection)
# and uploads results to code scanning. Public repos only, so it does nothing while private.
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '37 3 * * 2'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        with:
          sarif_file: results.sarif
