# Advisories, licences, bans and sources for the Rust dependency tree (policy: deny.toml).
# Uses the prebuilt cargo-deny container: nothing is compiled, so this takes about a minute.
name: security-audit

on:
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock", "crates/*/Cargo.toml", "deny.toml", ".github/workflows/security-audit.yml"]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check advisories licenses bans sources
