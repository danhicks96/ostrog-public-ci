# The Rust half of tools/ci.sh, enforced on every push and PR to the default branch (#354; master in the private repo, main in the public one), and a digest
# comparison between Linux and Windows (#355, #234). The art, audio and GDScript stages of
# tools/ci.sh need numpy, Pillow and Godot and still run locally. The toolchain is pinned by
# rust-toolchain.toml, which rustup on the runners reads.
name: ci

# Runs on pull requests and pushes to main/master. Check requirements are configured
# separately by the repository owner (the `hygiene` check lives in hygiene.yml, which also runs on edits); this template neither merges nor publishes.
# Safety: the trigger is `pull_request`, never `pull_request_target`; the token is read-only, and
# public jobs receive no confidential identifier lists. Private artifact audits run separately.
on:
  pull_request:
  push:
    branches: [master, main]
  schedule:
    # Daily full build of main: pushes to main run only the cheap jobs, so this gives main a real verdict.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs are replaced by newer pushes to the same PR. Each push to main gets its own group so
  # rapid merges no longer cancel one another (they only run the cheap jobs, see `changes`).
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The dev profile carries full debug info; ~90 test binaries with it filled the runner's disk
  # and the linker died ("ld terminated with signal 7 [Bus error]"). CI needs no debugger.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  changes:
    # Docs-only PRs (claims, notes) skip the long cargo jobs. The skipped jobs report "skipped",
    # which GitHub treats as passing for required checks. Pushes to main run only the cheap jobs; the scheduled and manual runs always build.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.f.outputs.code }}
    steps:
      - id: f
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" = push ]; then echo code=false >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$EVENT" != pull_request ]; then echo code=true >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/$PR/files" --jq '.[].filename') || { echo code=true >> "$GITHUB_OUTPUT"; exit 0; }
          if printf '%s\n' "$files" | grep -qvE '^(docs/.*\.md|[^/]+\.md)$'; then c=true; else c=false; fi
          echo "code=$c" >> "$GITHUB_OUTPUT"

  export-structure:
    # Structural absence check only; not privacy, rights, build or publication clearance.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I tools/check_export_structure.py
      - run: python3 -I tools/check_source_only.py

  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk (the test binaries fill the default runner)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /
      - run: rustup show && rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install procedural test dependencies
        run: python -m pip install -r tools/requirements-ci-art.txt
      - name: Source asset guards
        run: python3 -I tools/tests/source_assets_test.py
      - name: Generate required ephemeral test PNGs
        run: python3 tools/ci_source_assets.py
      - name: Fallback integrity and provenance
        run: python3 -I tools/art/provenance_check.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: README tables
        run: |
          python3 -I tools/docs/readme_tables.py --check || {
            python3 -I tools/docs/readme_tables.py && git --no-pager diff docs/REFERENCE.md; exit 1; }
      - run: python3 -I tools/docs/readme_flags.py

  digest:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The same commit must give the same world on both platforms (#234: glibc and MSVC rounded
    # libm's last bits differently until the sim's maths went through hf_sim::fmath).
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p hf-cli
      - name: Digest failure guard
        if: runner.os == 'Linux'
        run: python3 -I tools/tests/digest_job_test.py
      - name: digests
        run: |
          bin=target/release/ostrog
          [ -f "$bin.exe" ] && bin="$bin.exe"
          python3 -I tools/ci_digests.py "$bin" | tee digests-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.os }}
          path: digests-${{ matrix.os }}.txt

  digest-compare:
    needs: [changes, digest]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
      - run: |
          cat digests-*.txt
          diff digests-ubuntu-latest.txt digests-windows-latest.txt
