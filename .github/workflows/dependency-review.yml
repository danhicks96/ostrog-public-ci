# Flags new dependencies with known vulnerabilities or disallowed licences in a pull request.
# Needs the dependency graph; on a private repo it also needs GitHub Code Security. If the
# repo does not have it, the job reports that and passes (see docs/PROTECTIONS.md).
name: dependency-review

on:
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock", "crates/*/Cargo.toml", "tools/requirements-*.txt", ".github/workflows/**"]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        continue-on-error: ${{ github.event.repository.private }}
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
