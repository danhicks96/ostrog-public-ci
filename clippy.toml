disallowed-types = [
  { path = "std::collections::HashMap", reason = "iteration order is nondeterministic; use BTreeMap or an indexed Vec (DECISIONS D7)" },
  { path = "std::collections::HashSet", reason = "iteration order is nondeterministic; use BTreeSet (DECISIONS D7)" },
