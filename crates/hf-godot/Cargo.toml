[package]
name = "hf-godot"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
hf-sim = { path = "../hf-sim" }
hf-update = { path = "../hf-update" }
godot = { version = "0.5.5", features = ["api-4-6"] }
anyhow.workspace = true
serde_json.workspace = true
rayon.workspace = true

# The bridge test's CPU clock (#582); already in the lock through other crates.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
