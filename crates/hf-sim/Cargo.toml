[package]
name = "hf-sim"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libm = "0.2"
rand.workspace = true
rand_chacha.workspace = true
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true
rmp-serde.workspace = true
anyhow.workspace = true
rusqlite.workspace = true
sha2.workspace = true
hex.workspace = true
toml.workspace = true
rayon.workspace = true

[dev-dependencies]
tempfile = "3"

# The tests' CPU clock (tests/support/cpu.rs, #582); already in the lock through other crates.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

# The deaths probe's own tests (#1563). An example target is built but its #[test]s are not run
# unless it says so, and tools/ci.sh runs `cargo test --workspace`, not `--example`.
[[example]]
name = "deaths_probe"
test = true
