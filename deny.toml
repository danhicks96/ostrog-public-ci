# cargo-deny policy (advisories, licences, bans, sources). Run by .github/workflows/security-audit.yml.
# Licences must be compatible with the project's GPL-3.0-or-later code.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Known findings accepted for now; each needs a follow-up and is removed once fixed.
ignore = [
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is unmaintained but complete; saves depend on its format. Replacing it is a format migration." },
  { id = "RUSTSEC-2026-0459", reason = "bundled SQLite in libsqlite3-sys 0.28; fix needs the rusqlite 0.41 major bump. Only matters for database files an untrusted party wrote." },
  { id = "RUSTSEC-2026-0592", reason = "url 2.5.8 via ureq; fixed by `cargo update -p url` (2.5.9). Remove this entry with that lockfile bump." },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-or-later",
]

[bans]
multiple-versions = "warn"
# Workspace crates depend on each other by path, which cargo-deny counts as a wildcard.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
